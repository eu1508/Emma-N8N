# FreeLLMAPI – 30+ kostenlose LLM-Anbieter hinter einer OpenAI-kompatiblen /v1-Adresse.
# Quelle: https://github.com/tashfeenahmed/freellmapi (MIT-Lizenz)
services:
  freellmapi:
    image: ghcr.io/tashfeenahmed/freellmapi:latest
    container_name: freellmapi
    env_file:
      - .env
    environment:
      NODE_ENV: production
      PORT: 3001
    # Standardmäßig nur lokal erreichbar. HOST_BIND=0.0.0.0 in .env öffnet es fürs LAN.
    ports:
      - "${HOST_BIND:-127.0.0.1}:${PORT:-3001}:3001"
    volumes:
      - freellmapi-data:/app/server/data
    extra_hosts:
      - "host.docker.internal:host-gateway"
    restart: unless-stopped
    healthcheck:
      test:
        [
          "CMD",
          "node",
          "-e",
          "fetch('http://127.0.0.1:3001/api/ping').then((res) => { if (!res.ok) process.exit(1); }).catch(() => process.exit(1));"
        ]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3

volumes:
  freellmapi-data:
